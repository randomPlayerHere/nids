# Serves the built SPA and reverse-proxies API + WebSocket traffic to the
# backend container (service name "backend" on the compose network).
upstream nids_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache fingerprinted assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # WebSocket live-alert stream — needs Upgrade headers and no read timeout.
    location /ws/ {
        proxy_pass http://nids_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1d;
    }

    # REST API surface forwarded to FastAPI.
    location ~ ^/(api|health|features|predict)(/|$) {
        proxy_pass http://nids_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64m;          # allow large CSV uploads
        proxy_read_timeout 300s;           # SHAP analysis can be slow
    }

    # SPA fallback — every other path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
